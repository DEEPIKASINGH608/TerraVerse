version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: terraverse_postgis
    environment:
      POSTGRES_DB: terraverse
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: terraverse_backend
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@db:5432/terraverse
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: terraverse_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgis_data: